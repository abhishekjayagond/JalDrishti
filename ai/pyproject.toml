[project]
name = "jaldrishti-groundwater-ai"
version = "1.0.0"
description = "Annual groundwater forecasting and spatial-temporal AI service for JalDrishti"
authors = [{ name = "Abhishek Jayagond" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn==1.8.0",
  "joblib>=1.4,<2",
  "torch>=2.3,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

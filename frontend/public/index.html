<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="JalDrishti — Professional Groundwater Intelligence & Forecasting Platform. Telemetry monitoring, fluctuation analysis, recharge estimation, CGWB resource evaluation, and AI forecasting." />
    <meta name="author" content="Abhishek Jayagond" />
    <meta name="application-name" content="JalDrishti_abhi" />

    <!-- Open Graph -->
    <meta property="og:title" content="JalDrishti | Groundwater Intelligence &amp; Forecasting" />
    <meta property="og:description" content="Professional groundwater monitoring, analysis, and AI forecasting platform for India's aquifer systems." />
    <meta property="og:type" content="website" />

    <title>JalDrishti | Groundwater Intelligence &amp; Forecasting</title>

    <!-- Fonts: Inter (interface/headlines) + DM Sans (body) + JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        font-family: 'DM Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #000000;
        color: #EAEAEB;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      #jd-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000000;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #jd-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .jd-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .jd-wordmark-primary {
        font-family: 'Inter', sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #EAEAEB;
        margin-bottom: 8px;
      }

      .jd-tagline {
        font-family: 'DM Sans', sans-serif;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6b7280;
        margin-bottom: 28px;
      }

      .jd-loader {
        width: 120px;
        height: 1px;
        background: #374151;
        overflow: hidden;
      }

      .jd-loader-bar {
        width: 40%;
        height: 100%;
        background: #EAEAEB;
        animation: jd-slide 1.1s infinite ease-in-out;
      }

      @keyframes jd-slide {
        0%   { transform: translateX(-100%); }
        50%  { transform: translateX(180%); }
        100% { transform: translateX(360%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .jd-loader-bar { animation: none; width: 100%; opacity: 0.3; }
      }

      #root {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      #root.loaded {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <noscript>JavaScript is required to run JalDrishti Groundwater Intelligence.</noscript>

    <div id="jd-splash" role="status" aria-label="Loading JalDrishti">
      <div class="jd-splash-content">
        <div class="jd-wordmark-primary">JalDrishti</div>
        <div class="jd-tagline">Groundwater Intelligence</div>
        <div class="jd-loader">
          <div class="jd-loader-bar"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener('load', function () {
        var splash = document.getElementById('jd-splash');
        var root = document.getElementById('root');
        if (splash && root) {
          splash.classList.add('hidden');
          root.classList.add('loaded');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 350);
        }
      });
    </script>
  </body>
</html>
